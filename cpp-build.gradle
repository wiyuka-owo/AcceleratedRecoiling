repositories {
    ivy {
        name = "GitHub Toolchain Release"
        url = "https://github.com/wiyuka0/AcceleratedRecoiling/releases/download"
        patternLayout {
            artifact "[revision]/[artifact].[ext]"
        }
        metadataSources { artifact() }
    }
}

configurations {
    cppToolchain
}

dependencies {
    cppToolchain "com.wiyuka.env:AcceleratedRecoiling-third-party:toolchain_20260601_0@zip"
}

def cppProjectDir = file("./AcceleratedRecoiling-third-party")
def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

def registerNativeTask = { String taskName, String buildBatName, String description ->
    return tasks.register(taskName, Exec) {
        group = "build native"
        dependsOn "extractToolchain"
        onlyIf { isWindows }
        workingDir = cppProjectDir
        def envScript = file("${cppProjectDir}/env/add_env.bat").absolutePath
        def buildScript = file("${cppProjectDir}/build/${buildBatName}").absolutePath

        commandLine 'cmd', '/c', "call \"${envScript}\" && call \"${buildScript}\" < nul"

        doFirst {
            println "> 开始编译 ${description} (${buildBatName})"
        }
    }
}

tasks.register("extractToolchain", Copy) {
    group = "build native"
    dependsOn configurations.cppToolchain
    onlyIf {
        !new File(cppProjectDir, "env/add_env.bat").exists()
    }

    from({ zipTree(configurations.cppToolchain.singleFile) })
    into cppProjectDir
    doLast {
        println "> 解压完成"
    }
}

def compileWin = registerNativeTask("compileNativeWin", "win-x64.bat", "Windows 动态库")
def compileLinux = registerNativeTask("compileNativeLinux", "linux-x64.bat", "Linux 动态库")
def compileMac = registerNativeTask("compileNativeMac", "macos-x64.bat", "macOS 动态库")

def generatedNatives = layout.buildDirectory.dir("generated/natives")

tasks.register("copyNativesToResources", Copy) {
    def addNative = { String rel, String pattern, String dest ->
        def dir = file("${cppProjectDir}/out/${rel}")
        if (dir.directory) {
            from(dir) {
                include pattern
                into dest
            }
        }
    }
    addNative("win-x64", "*.dll", "natives/windows-x64")
    addNative("linux-x64", "*.so", "natives/linux-x64")
    addNative("macos-x64", "*.dylib", "natives/macos-x64")
    addNative("macos-arm64", "*.dylib", "natives/macos-arm64")
    into generatedNatives
}

sourceSets.main.resources.srcDir generatedNatives

tasks.named('copyNativesToResources').configure {
    mustRunAfter 'compileNativeWin', 'compileNativeLinux', 'compileNativeMac'
}

tasks.named('processResources').configure {
    dependsOn 'copyNativesToResources'
}

afterEvaluate {
    ['runClient', 'runServer', 'runGameTestServer'].each { taskName ->
        def runTask = tasks.findByName(taskName)
        if (runTask != null) {
            runTask.dependsOn 'copyNativesToResources'
        }
    }
}

tasks.named('jar').configure {
    dependsOn 'compileNativeWin', 'compileNativeLinux', 'compileNativeMac', 'copyNativesToResources'
}
